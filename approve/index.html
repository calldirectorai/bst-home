<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approve post | Bright Seal Tax</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0A0C10">
<style>
:root{--bg:#0A0C10;--card:#111721;--line:#223047;--text:#E8ECF2;--mute:#9AA7B8;--gold:#D4A62A;--gold2:#F2D06B}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.c{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
h1{font-size:24px;margin:0 0 10px}p{color:var(--mute);margin:0 0 20px}
button{width:100%;padding:16px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font:inherit;font-weight:700;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}#m{margin-top:16px;color:var(--text);min-height:24px}
</style></head><body>
<main class="c">
<h1>Post to Facebook?</h1>
<p>This publishes the draft you just received (by text or email) to the Bright Seal Tax Facebook page.</p>
<button id="go" type="button">Approve and post</button>
<div id="m" role="status"></div>
</main>
<script>
(function(){
var b=document.getElementById('go'),m=document.getElementById('m'),t0=Date.now();
b.addEventListener('click',function(e){
  if(!e.isTrusted||Date.now()-t0<1500||navigator.webdriver)return;
  b.disabled=true;m.textContent='Posting...';
  fetch('https://app.calldirector.ai/api/webhooks/flow/7021/739498a32fef12bc92cbde51fe065be36fb0bb7d247035c6a3dcafc5ab08c91d',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contactEmail:'irs-queue@brightsealtax.com',contactName:'IRS Post Queue',data:{}})
  }).then(function(r){
    if(!r.ok)throw 0;
    m.textContent='Approved. It is posting now. You will get a text when it is live.';b.textContent='Done';
  }).catch(function(){m.textContent='Something went wrong. Please call Rodrigue or try again.';b.disabled=false;});
});
})();
</script></body></html>
